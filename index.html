<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>碎晶突围</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	<script>
	// PWA 自动更新（patch_web_pwa.py 注入）：加载即检查新版；新 SW 接管后自动刷新一次
	if ('serviceWorker' in navigator) {
		var bootAt = performance.now();
		navigator.serviceWorker.register('index.service.worker.js').then(function (reg) {
			return reg.update();
		}).catch(function () {});
		document.addEventListener('visibilitychange', function () {
			if (document.hidden) { return; }
			navigator.serviceWorker.getRegistration().then(function (r) { if (r) { r.update().catch(function () {}); } }).catch(function () {});
		});
		navigator.serviceWorker.addEventListener('controllerchange', function () {
			if (sessionStorage.getItem('_sw_reloaded') === '1') { return; }
			if (performance.now() - bootAt > 20000) { return; }
			sessionStorage.setItem('_sw_reloaded', '1');
			location.reload();
		});
	}
	</script>
<script>
	// __audioUnlockTracked 移动端 WebAudio 解锁（patch_web_pwa.py 注入）：追踪引擎 AudioContext，手势内同步 resume
	(function () {
		var tracked = [];
		function wrap(name) {
			var Native = window[name];
			if (!Native) { return; }
			function Shim() {
				var ctx;
				try { ctx = new Native(...arguments); } catch (e) { ctx = new Native(); }
				tracked.push(ctx);
				return ctx;
			}
			Shim.prototype = Native.prototype;
			window[name] = Shim;
		}
		wrap('AudioContext');
		wrap('webkitAudioContext');
		function unlock() {
			for (var i = 0; i < tracked.length; i++) {
				var c = tracked[i];
				if (c && c.state !== 'closed' && c.resume) {
					try { var p = c.resume(); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
				}
			}
		}
		['touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'mousedown', 'keydown'].forEach(function (ev) {
			window.addEventListener(ev, unlock, { passive: true, capture: true });
		});
		document.addEventListener('visibilitychange', function () { if (!document.hidden) { unlock(); } });
		window.addEventListener('pageshow', function (ev) { if (ev.persisted) { unlock(); } });
		var healUntil = Date.now() + 120000;
		var heal = setInterval(function () {
			if (Date.now() > healUntil) { clearInterval(heal); return; }
			for (var i = 0; i < tracked.length; i++) {
				var c = tracked[i];
				if (c && c.state === 'suspended' && c.resume) {
					try { var p = c.resume(); if (p && p.catch) { p.catch(function () {}); } } catch (e) {}
				}
			}
		}, 2000);
		// __audioDiagReport 真机音频遥测（V0.8.4）：首次手势 30s 后弹一次诊断框，内容含版本号
		// ——同时解决两个盲区：确认 PWA 真的更新到了新版（弹窗即证明）、拿到真机的 ctx 状态
		var reported = false;
		function report() {
			if (reported) { return; }
			reported = true;
			setTimeout(function () {
				var states = [];
				for (var i = 0; i < tracked.length; i++) { states.push(tracked[i].state); }
				var mode = 'browser';
				try { if (window.matchMedia && matchMedia('(display-mode: standalone)').matches) { mode = 'PWA'; } } catch (e) {}
				var wk = 0;
				try { wk = performance.getEntriesByType('resource').filter(function (e) { return /worklet/.test(e.name); }).length; } catch (e) {}
				alert('[碎晶突围 音频诊断 V0.8.4]\n'
					+ '运行模式: ' + mode + '\n'
					+ '音频上下文: ' + (tracked.length ? tracked.length + ' 个 [' + states.join(',') + ']' : '未创建') + '\n'
					+ '音频组件(worklet)加载: ' + (wk > 0 ? wk + ' 个' : '0 个(异常!)') + '\n'
					+ '若无声请截图本弹窗发给开发者');
			}, 30000);
		}
		['touchstart', 'pointerdown', 'click', 'mousedown'].forEach(function (ev) {
			window.addEventListener(ev, function () { report(); }, { once: true, capture: true, passive: true });
		});
	})();
	</script>
</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2758492,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
